function hexToUint8Array(hex) {
    const bytes = [];
    for (let i = 0; i < hex.length; i += 2) bytes.push(parseInt(hex.substr(i,2),16));
    return new Uint8Array(bytes);
}

const encryptedData = hexToUint8Array(encryptedHex);
const salt = hexToUint8Array(saltHex);
const iv = hexToUint8Array(ivHex);

let maxRetries = 3;
let attemptCount = 0;

async function deriveKey(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 150000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
    );
}

async function unlock() {
    const password = document.getElementById("password").value;
    const errorElement = document.getElementById("error");
    const retryMessageElement = document.getElementById("retryMessage");
    const continueBtn = document.getElementById("continueBtn");

    errorElement.style.display = "none";
    retryMessageElement.textContent = "";

    try {
        const key = await deriveKey(password);
        const decryptedBuffer = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            encryptedData
        );
        const html = new TextDecoder().decode(decryptedBuffer);
		const container = document.createElement("div");
		container.innerHTML = html;

		// Append to DOM first
		document.body.innerHTML = "";
		document.head.querySelectorAll("style, link[rel='stylesheet']").forEach(el => el.remove());
		document.body.appendChild(container);

		// Re-run scripts manually
		container.querySelectorAll("script").forEach(oldScript => {
			const newScript = document.createElement("script");

			if (oldScript.src) {
				newScript.src = oldScript.src;
				newScript.async = false;
			} else {
				newScript.textContent = oldScript.textContent;
			}

			document.body.appendChild(newScript);
		});
    } catch (e) {
        attemptCount++;
        errorElement.style.display = "block";

        if (attemptCount >= maxRetries) {
            continueBtn.disabled = true;
            retryMessageElement.textContent = "Maximum attempts reached. Please try again later.";
        } else {
            retryMessageElement.textContent = `${maxRetries - attemptCount} attempts remaining.`;
        }
    }
}
